<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Lookup</title>
</head>
<body>
  <h1>Weather Lookup</h1>

  <form id="weather-form">
    <input id="city" type="text" placeholder="Enter a city" value="London" required>
    <button type="submit">Get weather</button>
  </form>

  <p id="message"></p>
  <section id="weather"></section>

  <script>
    const API_KEY = "906d5b56358452ecde66c56c197191f1";

    const form = document.getElementById("weather-form");
    const message = document.getElementById("message");
    const weather = document.getElementById("weather");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const city = document.getElementById("city").value.trim();
      message.textContent = "Loading...";
      weather.replaceChildren();

      try {
        const params = new URLSearchParams({
          access_key: API_KEY,
          query: city
        });

        const response = await fetch(
          `https://api.weatherstack.com/current?${params}`
        );
        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error?.info || "Could not get weather.");
        }

        const heading = document.createElement("h2");
        heading.textContent = `${data.location.name}, ${data.location.country}`;

        const details = document.createElement("p");
        details.textContent =
          `${data.current.temperature}°C, ${data.current.weather_descriptions.join(", ")}. ` +
          `Humidity: ${data.current.humidity}%. Wind: ${data.current.wind_speed} km/h.`;

        weather.append(heading, details);
        message.textContent = "";
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
