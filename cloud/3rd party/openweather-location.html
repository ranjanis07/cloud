<!DOCTYPE html>
<html>

<head>
    <title>Location Coordinates</title>
</head>

<body>

    <h2>Location Coordinates</h2>

    <input type="text" id="input" placeholder="Enter city name">

    <button onclick="getData()">Get Coordinates</button>

    <div id="result"></div>

    <script>

        async function getData() {

            const city = document.getElementById("input").value.trim();

            const apiKey = "1b5625b80333e117a2db90ecbc773209";

            const url =
                `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(city)}&limit=5&appid=${apiKey}`;

            try {

                console.log("Calling:", url.replace(apiKey, "HIDDEN"));

                const response = await fetch(url);

                console.log("Status:", response.status);

                if (!response.ok) {
                    throw new Error(`API request failed: ${response.status}`);
                }

                const data = await response.json();

                if (data.length === 0) {
                    throw new Error("Location not found");
                }

                const location = data[0];

                document.getElementById("result").innerHTML = `
                    <h3>${location.name}</h3>
                    <p>State: ${location.state || "Not available"}</p>
                    <p>Country: ${location.country}</p>
                    <p>Latitude: ${location.lat}</p>
                    <p>Longitude: ${location.lon}</p>
                `;

            } catch (error) {

                console.error(error);

                document.getElementById("result").innerHTML =
                    `<p style="color:red;">${error.message}</p>`;
            }
        }

    </script>

</body>

</html>
