
<!DOCTYPE html>
<html>
<body>
    <h2>Multiple Currency Converter</h2>

    Amount:
    <input type="number" id="amount" value="100">

    From:
    <select id="from">
        <option value="USD">USD</option>
        <option value="INR">INR</option>
        <option value="EUR">EUR</option>
    </select>

    <button onclick="convert()">Convert</button>

    <p id="result"></p>

    <script>
        async function convert() {
            let amount = Number(document.getElementById("amount").value);
            let from = document.getElementById("from").value;
            let key = "fc338a944b57456a6dbff187";

            let url =
                `https://v6.exchangerate-api.com/v6/${key}/latest/${from}`;

            try {
                let res = await fetch(url);
                let data = await res.json();

                if (data.result !== "success") {
                    throw new Error("API error");
                }

                let rates = data.conversion_rates;

                document.getElementById("result").innerHTML =
                    "INR: " + (amount * rates.INR).toFixed(2) + "<br>" +
                    "USD: " + (amount * rates.USD).toFixed(2) + "<br>" +
                    "EUR: " + (amount * rates.EUR).toFixed(2) + "<br>" +
                    "GBP: " + (amount * rates.GBP).toFixed(2) + "<br>" +
                    "JPY: " + (amount * rates.JPY).toFixed(2);

            } catch (error) {
                document.getElementById("result").innerText =
                    "Error fetching exchange rates";
            }
        }
    </script>
</body>
</html>
